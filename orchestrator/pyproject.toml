[project]
name = "relops-reprovision"
version = "0.1.0"
description = "Operator-side CLI that drives the end-to-end EACS workflow for a CI worker"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "taskcluster>=101",
    "asyncvnc>=1.1",  # hangar-screen-agent: VNC frame grab with Apple auth
    "pillow>=10",     # encode grabbed frames to JPEG
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # Upper bound is deliberate. There is no [tool.ruff] section in this repo, so
    # linting is entirely at the mercy of whichever rules ruff enables by default,
    # and CI installs ruff with `pip install -e '.[dev]'` + bare `ruff check .` --
    # it does not use uv.lock, so an unbounded range means CI silently tracks the
    # newest release.
    #
    # ruff 0.16.0 widened the default rule set and produced 29 errors on unchanged
    # code (SIM117 x16, UP033 x5, I001 x3, RUF012 x2, UP037, UP017, RUF100). 0.15.19
    # reports the same tree clean. That broke every open PR at once -- the failure
    # showed up on a branch whose only change was two shell scripts.
    #
    # Bump this deliberately, together with whatever fixes the new rules require.
    "ruff>=0.15,<0.16",
]

[project.scripts]
reprovision = "orchestrator.cli:app"
reprovision-runner = "orchestrator.runner:main"
hangar-screen-agent = "orchestrator.screen_agent:main"
hangar-tart-health-agent = "orchestrator.tart_health_agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*"]

# The macOS upgrade script ships inside the package so `--action os-update` can read it at
# run time. scripts/simplemdm-macos-upgrade.sh is a symlink to this same file -- one body, so
# the copy pasted into SimpleMDM and the copy driven over SSH cannot drift.
[tool.setuptools.package-data]
orchestrator = ["data/*.sh"]

[tool.pytest.ini_options]
markers = ["real_prewarm: exercise _prewarm_secret_env itself (opts out of the autouse stub)"]
asyncio_mode = "auto"
testpaths = ["tests"]
